<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Auto Glow — Master Dashboard</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body class="adm-body">
  <header class="navbar scrolled">
    <a href="index.html" class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="" width="44" height="44" />
      <span class="brand-text">Auto<span class="brand-accent">Glow</span> <span class="adm-tag">Master</span></span>
    </a>
    <div class="adm-nav-right">
      <span id="admWho" class="adm-who"></span>
      <button class="btn btn-ghost" id="admSignOut" hidden>Sign out</button>
    </div>
  </header>

  <main class="adm-main">
    <!-- Auth gate -->
    <section class="adm-gate" id="admGate">
      <div class="ag-box">
        <h2>Owner sign-in</h2>
        <p class="ag-sub">Enter your Auto Glow admin email.</p>
        <div id="gateStepEmail">
          <input class="bw-input" type="email" id="gateEmail" placeholder="you@autoglow.com" autocomplete="email" />
          <button class="btn btn-primary btn-block" id="gateSend">Email me a code</button>
        </div>
        <div id="gateStepCode" hidden>
          <input class="bw-input" type="text" id="gateCode" inputmode="numeric" placeholder="6-digit code" />
          <button class="btn btn-primary btn-block" id="gateVerify">Verify</button>
        </div>
        <p class="ag-msg" id="gateMsg"></p>
      </div>
    </section>

    <!-- Dashboard -->
    <section class="adm-dash" id="admDash" hidden>
      <div class="adm-stats" id="admStats">
        <div class="adm-stat"><strong id="stToday">0</strong><span>Today</span></div>
        <div class="adm-stat"><strong id="stUpcoming">0</strong><span>Upcoming</span></div>
        <div class="adm-stat"><strong id="stDone">0</strong><span>Completed</span></div>
        <div class="adm-stat"><strong id="stRevenue">$0</strong><span>Revenue (done)</span></div>
      </div>

      <div class="adm-toolbar">
        <div class="adm-filters" id="admFilters">
          <button class="bw-chip selected" data-f="active">Active</button>
          <button class="bw-chip" data-f="requested">Requested</button>
          <button class="bw-chip" data-f="confirmed">Confirmed</button>
          <button class="bw-chip" data-f="completed">Completed</button>
          <button class="bw-chip" data-f="cancelled">Cancelled</button>
          <button class="bw-chip" data-f="all">All</button>
        </div>
        <button class="btn btn-ghost" id="admRefresh">Refresh</button>
      </div>

      <div class="adm-list" id="admList"></div>
    </section>

    <!-- Not an admin -->
    <section class="adm-gate" id="admDenied" hidden>
      <div class="ag-box">
        <h2>No access</h2>
        <p class="ag-sub">This account isn't on the Auto Glow admin list.</p>
        <a class="btn btn-primary" href="index.html">Back to the site</a>
      </div>
    </section>
  </main>

  <script type="module" src="admin.js?v=10"></script>
</body>
</html>
